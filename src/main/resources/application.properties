spring.application.name=pix

# Configurações gerais do banco apontando para as Variáveis de Ambiente
spring.datasource.url=jdbc:mysql://localhost:3306/pix?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Força o Spring a dar erro em 5 segundos se a senha estiver errada (evita travar)
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.devtools.restart.enabled=false
